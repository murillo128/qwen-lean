[project]
name = "qwen-lean"
version = "0.1.0"
description = "Verified whole-proof evaluation for Qwen and Lean"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
baseline = [
  "vllm==0.10.2",
]
model = [
  "accelerate==1.10.1",
  "torch==2.8.0",
  "transformers==4.55.4",
]
phase2 = [
  "datasets==4.0.0",
]
training = [
  "accelerate==1.10.1",
  "bitsandbytes==0.47.0",
  "datasets==4.0.0",
  "peft==0.17.1",
  "torch==2.8.0",
  "transformers==4.55.4",
  "trl==0.22.2",
]
qwen35 = [
  "bitsandbytes==0.49.2",
  "nvidia-cuda-nvcc==13.0.48",
  "vllm==0.21.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
qwen-lean = "qwen_lean.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_lean"]

[tool.uv]
conflicts = [
  [
    { extra = "baseline" },
    { extra = "qwen35" },
  ],
  [
    { extra = "model" },
    { extra = "qwen35" },
  ],
  [
    { extra = "training" },
    { extra = "qwen35" },
  ],
]
