[project]
name = "qwen35-generalist-runtime"
version = "0.1.0"
description = "Isolated Qwen3.5 generalist SFT runtime for qwen-lean"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.1",
  "datasets==5.0.1",
  "peft==0.20.0",
  "qwen-lean",
  "torch==2.13.0",
  "transformers==5.15.1",
  "trl==1.10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
qwen-lean = { path = "../..", editable = true }
